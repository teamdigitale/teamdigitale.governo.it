name: Build and deploy site

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 2.6.3
          bundler: 2.0.1
          bundler-cache: true

      - name: Build site
        run: bundle exec jekyll build

      - name: Add custom domain
        run: echo "teamdigitale.governo.it" > _site/CNAME

      - name: Upload site artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: _site
          retention-days: 1

  deploy:
    name: Deploy
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pages: write

    steps:
      - name: Checkout deployment branch
        uses: actions/checkout@v7
        with:
          ref: gh-pages
          fetch-depth: 0

      - name: Download site artifact
        uses: actions/download-artifact@v8
        with:
          name: site
          path: ${{ runner.temp }}/site

      - name: Commit site to gh-pages
        env:
          SITE_DIR: ${{ runner.temp }}/site
        run: |
          set -euo pipefail

          test "$(git branch --show-current)" = "gh-pages"
          test -f "$SITE_DIR/index.html"

          rsync --archive --delete --exclude='.git/' "$SITE_DIR/" ./
          touch .nojekyll

          git config user.name "Deploy Bot"
          git config user.email "no-reply@teamdigitale.governo.it"
          git add --all
          git commit --allow-empty -m "Automated deployment to GitHub Pages: ${GITHUB_SHA}"
          git push origin gh-pages

      - name: Request GitHub Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            --method POST \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            "repos/${GITHUB_REPOSITORY}/pages/builds"
